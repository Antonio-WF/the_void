<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Maker</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #303030;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .start-button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            background: #f56200;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .start-button:hover {
            background: white;
            color: #f56200;
            font-size:30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Enter The Void?</h1>

        <button class="start-button" onclick="openVoid()">
            Yes
        </button>
    </div>

    <script>
        function openVoid() {
            window.location.href = "void.html";
        }
    </script>

</body>
</html>
